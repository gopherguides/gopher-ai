# Zero CI (2026-09-28): no push or PR runs. Workers run make check locally and post the local-gate status; an hourly build on mac-studio runs the full suite and cuts releases.
name: Check Shared Sync

on:
  workflow_dispatch:

jobs:
  check-sync:
    if: github.event_name != 'pull_request' || github.event.pull_request.draft == false
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Check shared files are in sync
        run: ./scripts/check-shared-sync.sh
