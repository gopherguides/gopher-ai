name: Integration Tests

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test-codex-plugin-lifecycle:
    name: 'Codex compatibility (${{ matrix.lane }}: ${{ matrix.codex-version }})'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        include:
          - lane: minimum
            codex-version: '0.146.0'
            expected-version: '0.146.0'
          - lane: current
            codex-version: latest
            expected-version: ''
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: '22'
          package-manager-cache: false

      - name: Install Codex CLI
        run: npm install --global "@openai/codex@${{ matrix.codex-version }}"

      - name: Test real Codex plugin lifecycle
        env:
          CODEX_LIFECYCLE_EXPECTED_VERSION: ${{ matrix.expected-version }}
        run: ./scripts/test-codex-plugin-lifecycle.sh

      - name: Probe Default-mode shared-skill input behavior
        run: python3 ./scripts/test-codex-default-mode-input.py

      - name: Validate platform capability matrix
        run: python3 ./scripts/test-platform-capabilities.py

      - name: Install pinned Tailwind MCP server
        timeout-minutes: 3
        env:
          TAILWIND_MCP_INSTALL_ROOT: ${{ runner.temp }}/gopher-ai-tailwind-mcp-install
          npm_config_cache: ${{ runner.temp }}/gopher-ai-tailwind-mcp-npm-cache
        run: npm install --prefix "$TAILWIND_MCP_INSTALL_ROOT" --no-save --package-lock=false "tailwindcss-mcp-server@0.1.1"

      - name: Probe declared Tailwind MCP tools
        timeout-minutes: 2
        env:
          TAILWIND_MCP_INSTALL_ROOT: ${{ runner.temp }}/gopher-ai-tailwind-mcp-install
          npm_config_cache: ${{ runner.temp }}/gopher-ai-tailwind-mcp-npm-cache
        run: node ./scripts/test-tailwind-mcp-server.mjs

      - name: Probe all-plugin qualified Codex skill names
        run: python3 ./scripts/test-codex-skill-names.py

      - name: Probe explicit go-workflow skill arguments
        run: python3 ./scripts/test-codex-skill-arguments.py

  test-installation:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          # Full history is required: the legacy skill ownership check compares
          # the committed manifest with base-branch history plus the PR's final
          # skill tree, matching the repository's squash-merge result.
          fetch-depth: 0

      - name: Test plugin installation
        run: ./scripts/test-installation.sh

  test-commands:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Install test dependencies
        run: python3 -m pip install --requirement requirements-test.txt

      - name: Test command files
        run: ./scripts/test-commands.sh

  test-hooks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Test hook files
        run: ./scripts/test-hooks.sh

  test-worktree-create:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Test worktree creation
        run: ./scripts/test-worktree-create.sh

  test-ship-e2e-gate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Test ship E2E gate
        run: ./scripts/test-ship-e2e-gate.sh

  check-shared-sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Check shared files are in sync
        run: ./scripts/check-shared-sync.sh
