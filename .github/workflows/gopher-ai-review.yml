name: Gopher AI Code Review

on:
  workflow_dispatch:
    inputs:
      pr_number:
        description: Pull request number to review
        required: true
        type: number

permissions:
  contents: read
  issues: write
  pull-requests: write

concurrency:
  group: gopher-ai-review-${{ inputs.pr_number || github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  review:
    if: github.event_name != 'pull_request' || github.event.pull_request.draft == false
    name: AI Code Review
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7

      - name: Resolve pull request head
        id: pr
        env:
          GH_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ inputs.pr_number || github.event.pull_request.number }}
        run: echo "head_sha=$(gh pr view "$PR_NUMBER" --repo "$GITHUB_REPOSITORY" --json headRefOid --jq .headRefOid)" >> "$GITHUB_OUTPUT"

      - name: Run Gopher AI review
        id: review
        uses: ./.github/actions/gopher-ai-review
        with:
          api-key: ${{ secrets.GOPHER_AI_API_KEY }}
          github-token: ${{ github.token }}
          pr-number: ${{ inputs.pr_number || github.event.pull_request.number }}
          head-sha: ${{ steps.pr.outputs.head_sha }}

      - name: Publish review status in job summary
        if: always()
        env:
          FILE_COUNT: ${{ steps.review.outputs.file-count || '0' }}
          HAS_ISSUES: ${{ steps.review.outputs.has-issues || 'false' }}
          REVIEWED_HEAD: ${{ steps.review.outputs.reviewed-head || steps.pr.outputs.head_sha }}
          SKIP_REASON: ${{ steps.review.outputs.skip-reason || (github.event_name == 'merge_group' && 'reviewed-on-pull-request') || 'none' }}
          SUMMARY: ${{ steps.review.outputs.summary || (github.event_name == 'merge_group' && 'PR review already runs before queue admission') || 'review did not complete' }}
        run: |
          {
            echo '## Gopher AI Code Review'
            echo "- Summary: **$SUMMARY**"
            echo "- Files reviewed: **$FILE_COUNT**"
            echo "- Skip reason: **$SKIP_REASON**"
            echo "- Issues found: **$HAS_ISSUES**"
            echo "- Reviewed head: **$REVIEWED_HEAD**"
          } >> "$GITHUB_STEP_SUMMARY"
          if [ -f .gopher-ai-review/status.md ]; then
            echo >> "$GITHUB_STEP_SUMMARY"
            sed -n '1,160p' .gopher-ai-review/status.md >> "$GITHUB_STEP_SUMMARY"
          fi
